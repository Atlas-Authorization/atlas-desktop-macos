name: ci
on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint scripts and plists
        run: |
          for f in scripts/*.sh pam/tests/*.sh; do bash -n "$f"; done
          plutil -lint Plugin/Info.plist launchd/*.plist PlatformSSO/*.plist PlatformSSO/*.in
      - name: PAM module (build, unit tests)
        run: |
          make -C pam
          make -C pam test
          lipo -info pam/build/pam_atlas.so
      - name: PAM install and uninstall scripts (staged filesystem)
        run: bash pam/tests/install_test.sh
      - name: PAM integration test (real PAM stack, test build, fake helper)
        run: sudo make -C pam itest
      - name: Passkey helper app (unsigned build, entitlement plumbing only)
        run: bash scripts/build-passkey-helper.sh --domain auth.example.com --out "$RUNNER_TEMP/passkey"
      - name: Platform SSO app and extension (unsigned; proves it builds as an app extension)
        run: |
          bash scripts/build-platform-sso.sh --out "$RUNNER_TEMP/psso"
          test -x "$RUNNER_TEMP/psso/AtlasPlatformSSO.app/Contents/PlugIns/AtlasPlatformSSO.appex/Contents/MacOS/atlas-platform-sso"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$RUNNER_TEMP/psso/AtlasPlatformSSO.app/Contents/PlugIns/AtlasPlatformSSO.appex/Contents/Info.plist" | grep -qx com.apple.AppSSO.idp-extension
      - name: Build plugin (unsigned)
        run: bash scripts/build-plugin.sh
      - name: Build pkg (unsigned)
        run: bash scripts/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasDesktopMFA-unsigned
          path: dist/*-unsigned.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HAVE_SECRETS: ${{ secrets.ATLAS_DEVELOPER_ID_APP_P12_BASE64 != '' && secrets.ATLAS_DEVELOPER_ID_INSTALLER_P12_BASE64 != '' && secrets.ATLAS_P12_PASSWORD != '' && secrets.ATLAS_NOTARY_KEY_BASE64 != '' && secrets.ATLAS_NOTARY_KEY_ID != '' && secrets.ATLAS_NOTARY_ISSUER != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: echo "ATLAS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Import signing identities into a temporary keychain
        if: env.HAVE_SECRETS == 'true'
        env:
          APP_P12: ${{ secrets.ATLAS_DEVELOPER_ID_APP_P12_BASE64 }}
          INST_P12: ${{ secrets.ATLAS_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ATLAS_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.ATLAS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/atlas-signing.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INST_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security import "$RUNNER_TEMP/inst.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/inst.p12"
          APP_ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          INST_ID="$(security find-identity -v "$KC" | grep 'Developer ID Installer' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$APP_ID" ] && [ -n "$INST_ID" ] || { echo "identities not found in the imported p12 files" >&2; exit 1; }
          echo "ATLAS_CODESIGN_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "ATLAS_INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "ATLAS_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "ATLAS_NOTARY_KEY_ID=${{ secrets.ATLAS_NOTARY_KEY_ID }}" >> "$GITHUB_ENV"
          echo "ATLAS_NOTARY_ISSUER=${{ secrets.ATLAS_NOTARY_ISSUER }}" >> "$GITHUB_ENV"

      - name: Build plugin
        run: bash scripts/build-plugin.sh

      - name: Build signed pkg and notarise
        if: env.HAVE_SECRETS == 'true'
        run: |
          bash scripts/build-pkg.sh --sign
          bash scripts/notarize.sh "dist/AtlasDesktopMFA-${ATLAS_VERSION}.pkg"

      - name: Build unsigned pkg (no signing secrets configured)
        if: env.HAVE_SECRETS != 'true'
        run: bash scripts/build-pkg.sh

      - name: Remove signing material
        if: always() && env.HAVE_SECRETS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/atlas-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Release notes
        run: |
          if [ "$HAVE_SECRETS" = true ]; then echo "Signed and notarised installer." > dist/RELEASE_NOTES.txt
          else echo "UNSIGNED build: no signing secrets were configured. Not for production machines." > dist/RELEASE_NOTES.txt; fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg
          body_path: dist/RELEASE_NOTES.txt
